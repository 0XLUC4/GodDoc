[package]
name = "goddoc"
description = "GodDoc: pure-Rust word processor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "goddoc"
path = "src/main.rs"

[dependencies]
goddoc-core.workspace = true
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.35"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17"
egui-phosphor = "0.13"

[build-dependencies]
winresource = "0.1"
