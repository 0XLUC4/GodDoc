[package]
name = "goddoc"
description = "GodDoc: pure-Rust word processor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "goddoc"
path = "src/main.rs"

[dependencies]
goddoc-core.workspace = true
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.35"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17"
# Packs the pictures of the pages of a PDF; through miniz_oxide: no C code.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
egui-phosphor = "0.13"
serde_json = "1"
ureq = "3"
spellbook = "0.4.2"

[build-dependencies]
winresource = "0.1"
